name: Daily inventory scrape

on:
  schedule:
    # 12:00 UTC = 17:30 IST, Monday to Friday.
    # Cron is always UTC and India has no DST, so this never drifts.
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated text to match against site URLs, e.g. twinpineford,bobsford (blank = all)'
        required: false
        default: ''
      limit:
        description: 'Process only this many pending sites, e.g. 5 (blank = all)'
        required: false
        default: ''
      force:
        description: 'Re-scrape sites that already have a file in Drive today'
        type: boolean
        required: false
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: daily-scrape
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: npm install

      - name: Run scrapers
        env:
          SHEET_ID:         ${{ secrets.SHEET_ID }}
          SHEET_TAB:        Main
          URL_COL:          L
          SCRIPT_COL:       M
          APPS_SCRIPT_URL:  ${{ secrets.APPS_SCRIPT_URL }}
          RUN_SECRET:       ${{ secrets.RUN_SECRET }}
          TIMEZONE:         America/New_York
          CONCURRENCY:      '8'
          SITE_TIMEOUT_MS:  '150000'
          IDLE_GRACE_MS:    '8000'
          BLOCK_ASSETS:     '1'
          # PROXY_URL:      ${{ secrets.PROXY_URL }}   # uncomment for geo-restricted sites
          ONLY:             ${{ github.event.inputs.only }}
          LIMIT:            ${{ github.event.inputs.limit }}
          SKIP_EXISTING:    ${{ github.event.inputs.force == 'true' && '0' || '1' }}
          MAX_MINUTES:      '0'
        run: node src/run.js

      - name: Keep a copy of the CSVs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csvs-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
