name: Daily inventory scrape

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated text to match against site URLs, e.g. twinpineford,bobsford (blank = all)'
        required: false
        default: ''
      limit:
        description: 'Process only this many pending sites, e.g. 5 (blank = all)'
        required: false
        default: ''
      force:
        description: 'Re-scrape sites that already have a file in Drive today'
        type: boolean
        required: false
        default: false
      sheet_id:
        description: 'Sheet id (blank = the SHEET_ID secret)'
        required: false
        default: ''
      sheet_tab:
        description: 'Tab name (blank = Main)'
        required: false
        default: ''
      url_col:
        description: 'Column holding the site URL (blank = L)'
        required: false
        default: ''
      script_col:
        description: 'Column holding the Drive script link (blank = M)'
        required: false
        default: ''
      filter_col:
        description: 'Optional column to filter rows on, e.g. S'
        required: false
        default: ''
      filter_value:
        description: 'Only scrape rows whose filter column matches this'
        required: false
        default: ''

jobs:
  # Counts the sites in the sheet and decides how many parallel shards to run.
  # Keeps wall-clock roughly flat as the sheet grows, with nothing to edit here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total:  ${{ steps.plan.outputs.total }}
      sites:  ${{ steps.plan.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          PLAN_ONLY:       '1'
          SHEET_ID:        ${{ github.event.inputs.sheet_id || secrets.SHEET_ID }}
          SHEET_TAB:       ${{ github.event.inputs.sheet_tab || 'Main' }}
          SHEET_GID:       '0'      # export endpoint; gviz truncates large sheets
          URL_COL:         ${{ github.event.inputs.url_col || 'L' }}
          SCRIPT_COL:      ${{ github.event.inputs.script_col || 'M' }}
          FILTER_COL:      ${{ github.event.inputs.filter_col }}
          FILTER_VALUE:    ${{ github.event.inputs.filter_value }}
          SITES_PER_SHARD: '25'
          MAX_SHARDS:      '20'
          # The plan job must see the same filter the shards will, or a 4-site run
          # still gets planned as 8 shards and six of them find nothing to do.
          ONLY:            ${{ github.event.inputs.only }}
          LIMIT:           ${{ github.event.inputs.limit }}
          LOT_SIZE:        '0'      # no Lot folders - CSVs go straight into the date folder
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          RUN_SECRET:      ${{ secrets.RUN_SECRET }}
          TIMEZONE:        America/New_York
        run: node src/run.js

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Each shard takes every Nth row of the sheet. Lots and the manifest are keyed
    # off sheet position, so shards never need to coordinate.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: npm install

      - name: Run scrapers
        env:
          SHEET_ID:         ${{ github.event.inputs.sheet_id || secrets.SHEET_ID }}
          SHEET_TAB:        ${{ github.event.inputs.sheet_tab || 'Main' }}
          SHEET_GID:        '0'     # export endpoint; gviz truncates large sheets
          URL_COL:          ${{ github.event.inputs.url_col || 'L' }}
          SCRIPT_COL:       ${{ github.event.inputs.script_col || 'M' }}
          FILTER_COL:       ${{ github.event.inputs.filter_col }}
          FILTER_VALUE:     ${{ github.event.inputs.filter_value }}
          APPS_SCRIPT_URL:  ${{ secrets.APPS_SCRIPT_URL }}
          RUN_SECRET:       ${{ secrets.RUN_SECRET }}
          TIMEZONE:         America/New_York
          CONCURRENCY:      '5'
          SITE_TIMEOUT_MS:  '150000'
          IDLE_GRACE_MS:    '12000'
          BLOCK_ASSETS:     '1'
          MIN_ROWS_RATIO:   '0.75'   # flag a site returning under 75% of last time
          SHARD_INDEX:      ${{ matrix.shard }}
          SHARD_TOTAL:      ${{ needs.plan.outputs.total }}
          LOT_SIZE:         '0'      # no Lot folders - CSVs go straight into the date folder
          MANIFEST_BATCH:   '25'
          KEEP_DAYS:        '7'      # shard 0 trashes date folders older than this
          ATTEMPTS:         '3'
          RETRY_DELAY_MS:   '12000'
          SITE_BUDGET_MS:   '450000'
          # PROXY_URL:      ${{ secrets.PROXY_URL }}   # uncomment for geo-restricted sites
          ONLY:             ${{ github.event.inputs.only }}
          LIMIT:            ${{ github.event.inputs.limit }}
          SKIP_EXISTING:    ${{ github.event.inputs.force == 'true' && '0' || '1' }}
          MAX_MINUTES:      '0'
        run: node src/run.js

      - name: Keep a copy of the CSVs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csvs-${{ github.run_number }}-shard${{ matrix.shard }}
          path: out/
          retention-days: 2
          if-no-files-found: ignore

  # Once every shard is finished, group the day's CSVs into LOT_xxx folders by
  # row count. Apps Script does the packing and moving; this job just drives it.
  lots:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pack CSVs into lots
        env:
          LOTS_ONLY:       '1'
          SHEET_ID:        ${{ github.event.inputs.sheet_id || secrets.SHEET_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          RUN_SECRET:      ${{ secrets.RUN_SECRET }}
          TIMEZONE:        America/New_York
        run: node src/run.js
