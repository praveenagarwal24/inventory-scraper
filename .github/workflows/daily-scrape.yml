name: Daily inventory scrape

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated text to match against site URLs, e.g. twinpineford,bobsford (blank = all)'
        required: false
        default: ''
      limit:
        description: 'Process only this many pending sites, e.g. 5 (blank = all)'
        required: false
        default: ''
      force:
        description: 'Re-scrape sites that already have a file in Drive today'
        type: boolean
        required: false
        default: false

jobs:
  # Counts the sites in the sheet and decides how many parallel shards to run.
  # Keeps wall-clock roughly flat as the sheet grows, with nothing to edit here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total:  ${{ steps.plan.outputs.total }}
      sites:  ${{ steps.plan.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          PLAN_ONLY:       '1'
          SHEET_ID:        ${{ secrets.SHEET_ID }}
          SHEET_TAB:       Main
          SHEET_GID:       '0'      # export endpoint; gviz truncates large sheets
          URL_COL:         L
          SCRIPT_COL:      M
          SITES_PER_SHARD: '25'
          MAX_SHARDS:      '20'
          # The plan job must see the same filter the shards will, or a 4-site run
          # still gets planned as 8 shards and six of them find nothing to do.
          ONLY:            ${{ github.event.inputs.only }}
          LIMIT:           ${{ github.event.inputs.limit }}
          LOT_SIZE:        '0'      # no Lot folders - CSVs go straight into the date folder
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          RUN_SECRET:      ${{ secrets.RUN_SECRET }}
          TIMEZONE:        America/New_York
        run: node src/run.js

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Each shard takes every Nth row of the sheet. Lots and the manifest are keyed
    # off sheet position, so shards never need to coordinate.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: npm install

      - name: Run scrapers
        env:
          SHEET_ID:         ${{ secrets.SHEET_ID }}
          SHEET_TAB:        Main
          SHEET_GID:        '0'     # export endpoint; gviz truncates large sheets
          URL_COL:          L
          SCRIPT_COL:       M
          APPS_SCRIPT_URL:  ${{ secrets.APPS_SCRIPT_URL }}
          RUN_SECRET:       ${{ secrets.RUN_SECRET }}
          TIMEZONE:         America/New_York
          CONCURRENCY:      '5'
          SITE_TIMEOUT_MS:  '150000'
          IDLE_GRACE_MS:    '12000'
          BLOCK_ASSETS:     '1'
          MIN_ROWS_RATIO:   '0.75'   # flag a site returning under 75% of last time
          SHARD_INDEX:      ${{ matrix.shard }}
          SHARD_TOTAL:      ${{ needs.plan.outputs.total }}
          LOT_SIZE:         '0'      # no Lot folders - CSVs go straight into the date folder
          MANIFEST_BATCH:   '25'
          KEEP_DAYS:        '7'      # shard 0 trashes date folders older than this
          ATTEMPTS:         '3'
          RETRY_DELAY_MS:   '12000'
          SITE_BUDGET_MS:   '450000'
          # PROXY_URL:      ${{ secrets.PROXY_URL }}   # uncomment for geo-restricted sites
          ONLY:             ${{ github.event.inputs.only }}
          LIMIT:            ${{ github.event.inputs.limit }}
          SKIP_EXISTING:    ${{ github.event.inputs.force == 'true' && '0' || '1' }}
          MAX_MINUTES:      '0'
        run: node src/run.js

      - name: Keep a copy of the CSVs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csvs-${{ github.run_number }}-shard${{ matrix.shard }}
          path: out/
          retention-days: 2
          if-no-files-found: ignore

  # ---------------------------------------------------------------- retry pass
  # A second, more patient attempt at whatever the first pass did not land.
  # It needs no list: the manifest already knows what is missing.

  replan:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.replan.outputs.shards }}
      total:  ${{ steps.replan.outputs.total }}
      sites:  ${{ steps.replan.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
      - id: replan
        env:
          PLAN_ONLY:       '1'
          PLAN_PENDING:    '1'      # count only what Drive is still missing
          SHEET_ID:        ${{ secrets.SHEET_ID }}
          SHEET_TAB:       Main
          SHEET_GID:       '0'
          URL_COL:         L
          SCRIPT_COL:      M
          SITES_PER_SHARD: '10'     # smaller slices, so the retry finishes quickly
          MAX_SHARDS:      '20'
          ONLY:            ${{ github.event.inputs.only }}
          LIMIT:           ${{ github.event.inputs.limit }}
          LOT_SIZE:        '0'
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          RUN_SECRET:      ${{ secrets.RUN_SECRET }}
          TIMEZONE:        America/New_York
        run: node src/run.js

  retry:
    needs: replan
    # An empty matrix means nothing was outstanding, and this job simply does not run.
    if: always() && needs.replan.outputs.total != '0' && needs.replan.outputs.total != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.replan.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm install

      # A real, visible Chrome inside a virtual display. Far harder for anti-bot
      # systems to spot than headless, and free on GitHub's runners.
      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Retry what is still missing
        env:
          SHEET_ID:         ${{ secrets.SHEET_ID }}
          SHEET_TAB:        Main
          SHEET_GID:        '0'
          URL_COL:          L
          SCRIPT_COL:       M
          APPS_SCRIPT_URL:  ${{ secrets.APPS_SCRIPT_URL }}
          RUN_SECRET:       ${{ secrets.RUN_SECRET }}
          TIMEZONE:         America/New_York

          # Slower and more patient than the first pass, and closer to a real
          # browser: no request interception, fewer sites at once, longer waits.
          CONCURRENCY:      '4'
          SITE_TIMEOUT_MS:  '300000'
          SITE_BUDGET_MS:   '330000'   # one full 5-minute attempt, then stop
          IDLE_GRACE_MS:    '20000'
          ATTEMPTS:         '2'
          RETRY_DELAY_MS:   '10000'
          BLOCK_ASSETS:     '0'
          NAV_TIMEOUT_MS:   '60000'
          MAX_MINUTES:      '10'       # stop starting new sites after this
          MIN_ROWS_RATIO:   '0.75'
          PASS_LABEL:       'Retry pass'

          SHARD_INDEX:      ${{ matrix.shard }}
          SHARD_TOTAL:      ${{ needs.replan.outputs.total }}
          LOT_SIZE:         '0'
          MANIFEST_BATCH:   '25'
          ONLY:             ${{ github.event.inputs.only }}
          LIMIT:            ${{ github.event.inputs.limit }}
          SKIP_EXISTING:    '1'        # always skip what the first pass landed
          HEADFUL:          '1'        # real Chrome, not headless
          USER_DATA_DIR:    '/tmp/retry-chrome-profile'
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" node src/run.js

      - name: Keep a copy of the CSVs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-csvs-${{ github.run_number }}-shard${{ matrix.shard }}
          path: out/
          retention-days: 2
          if-no-files-found: ignore
