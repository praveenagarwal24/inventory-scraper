name: Pickup blocked sites (self-hosted)

# Runs on YOUR Mac, on YOUR IP, for the dealer sites that block datacenter ranges.
# Because the runner skips anything already in Drive for today, this needs no list
# of blocked sites - it simply collects whatever the cloud run could not get.

on:
  # Starts by itself the moment the cloud scrape finishes, manual or scheduled.
  workflow_run:
    workflows: ["Daily inventory scrape"]
    types: [completed]

  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated text to match against site URLs (blank = all pending)'
        required: false
        default: ''
      force:
        description: 'Re-scrape sites that already have a file in Drive today'
        type: boolean
        required: false
        default: false

jobs:
  pickup:
    runs-on: self-hosted
    timeout-minutes: 90
    # The Mac runs one job at a time, so without this a second trigger just queues
    # up behind the first and runs again for no reason.
    concurrency:
      group: pickup-blocked
      cancel-in-progress: true
    # A partly-failed cloud run is exactly when this matters, so only skip cancels.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          # Uses the Mac's own Chrome (CHROME_PATH below), so there is no reason to
          # download Puppeteer's copy - and skipping it avoids the broken cache that
          # breaks npm install on macOS.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install

      - name: Scrape whatever is still missing
        env:
          SHEET_ID:         ${{ secrets.SHEET_ID }}
          SHEET_TAB:        Main
          URL_COL:          L
          SCRIPT_COL:       M
          APPS_SCRIPT_URL:  ${{ secrets.APPS_SCRIPT_URL }}
          RUN_SECRET:       ${{ secrets.RUN_SECRET }}
          TIMEZONE:         America/New_York
          CHROME_PATH:      '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'

          CONCURRENCY:      '5'      # your Mac handles this fine
          SITE_TIMEOUT_MS:  '150000' # slowest good scrape has been ~93s
          SITE_BUDGET_MS:   '300000' # hard cap per site, across all attempts
          IDLE_GRACE_MS:    '8000'
          ATTEMPTS:         '2'      # these sites are usually blocked, not slow
          RETRY_DELAY_MS:   '8000'
          BLOCK_ASSETS:     '1'
          LOT_SIZE:         '0'      # match the cloud run
          MAX_MINUTES:      '40'     # stop starting new sites after this; resume next run

          ONLY:             ${{ github.event.inputs.only }}
          SKIP_EXISTING:    ${{ github.event.inputs.force == 'true' && '0' || '1' }}
        run: node src/run.js

      - name: Keep a copy of the CSVs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickup-csvs-${{ github.run_number }}
          path: out/
          retention-days: 2
          if-no-files-found: ignore
